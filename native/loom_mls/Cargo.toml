[package]
name = "loom_mls"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
openmls = "=0.9.0"
openmls_rust_crypto = "0.6"
openmls_basic_credential = { version = "0.6", features = ["clonable"] }
openmls_traits = "0.6"
tls_codec = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
chacha20poly1305 = "0.10"
rand = "0.8"

# Upstream adapter source is unchanged; only its exact optional KEM dependency
# pin is advanced to the upstream RustSec-fixed release. See vendored provenance.
[patch.crates-io]
hpke-rs-libcrux = { path = "../../third_party/hpke-rs-libcrux" }
# Upstream compiler-diagnostic backport; runtime/crypto source unchanged (ADR 012).
hax-lib-macros = { path = "../../third_party/hax-lib-macros" }
