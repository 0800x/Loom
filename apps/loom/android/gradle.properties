org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# One AGP version for the app and plugins with their own buildscript classpath.
loomAgpVersion=9.1.0
# Keep the legacy AGP DSL compatibility shim until Flutter removes it.
android.newDsl=false
# Flutter 3.47 + AGP 9 support built-in Kotlin. Keeping this enabled lets migrated
# plugins such as flutter_webrtc avoid applying the legacy Kotlin Gradle Plugin.
android.builtInKotlin=true
