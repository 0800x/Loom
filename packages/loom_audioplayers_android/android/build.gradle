group 'xyz.luan.audioplayers'
version '1.0-SNAPSHOT'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath "com.android.tools.build:gradle:${project.findProperty('loomAgpVersion') ?: '9.1.0'}"
    }
}
apply plugin: 'com.android.library'
android {
    namespace 'xyz.luan.audioplayers'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main.kotlin.srcDirs += 'src/main/kotlin' }
    defaultConfig { minSdkVersion 24 }
    lint { disable 'InvalidPackage' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
}
// AGP 9 supplies Kotlin. The obsolete Android JUnit Gradle plugin is omitted;
// it is unrelated to production playback and incompatible with this toolchain.
