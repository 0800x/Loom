name: loom
services:
  postgres:
    labels:
      org.loom.installation: /opt/loom-node
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - loom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    labels:
      org.loom.installation: /opt/loom-node
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LOOM_S3_ACCESS_KEY_ID:?set LOOM_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${LOOM_S3_SECRET_ACCESS_KEY:?set LOOM_S3_SECRET_ACCESS_KEY}
    volumes:
      - loom-objects:/data

  minio-init:
    labels:
      org.loom.installation: /opt/loom-node
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      MC_HOST_loom: http://${LOOM_S3_ACCESS_KEY_ID}:${LOOM_S3_SECRET_ACCESS_KEY}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc ready loom; do sleep 2; done; mc mb --ignore-existing loom/${LOOM_S3_BUCKET:-loom-attachments}"]

  loom-node:
    labels:
      org.loom.installation: /opt/loom-node
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        LOOM_BUILD_COMMIT: ${LOOM_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "7483"
    ports:
      - "127.0.0.1:${LOOM_HOST_PORT:-7483}:7483"
    volumes:
      - loom-node-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7483/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    labels:
      org.loom.installation: /opt/loom-node
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      loom-node:
        condition: service_healthy
    environment:
      LOOM_PUBLIC_DOMAIN: ${LOOM_PUBLIC_DOMAIN:?set LOOM_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - loom-caddy-data:/data
      - loom-caddy-config:/config

volumes:
  loom-postgres:
    labels:
      org.loom.installation: /opt/loom-node
  loom-objects:
    labels:
      org.loom.installation: /opt/loom-node
  loom-node-data:
    labels:
      org.loom.installation: /opt/loom-node
  loom-caddy-data:
    labels:
      org.loom.installation: /opt/loom-node
  loom-caddy-config:
    labels:
      org.loom.installation: /opt/loom-node


networks:
  default:
    labels:
      org.loom.installation: /opt/loom-node
