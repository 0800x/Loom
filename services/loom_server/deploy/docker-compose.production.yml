name: loom
services:
  postgres:
    labels:
      org.loom.installation: /opt/loom-node
    image: ${LOOM_DOCKER_PREFIX:-}postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - loom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    labels:
      org.loom.installation: /opt/loom-node
    image: ghcr.io/0800x/loom-minio:${LOOM_IMAGE_TAG:?set_LOOM_IMAGE_TAG}
    pull_policy: always
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LOOM_S3_ACCESS_KEY_ID:?set LOOM_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${LOOM_S3_SECRET_ACCESS_KEY:?set LOOM_S3_SECRET_ACCESS_KEY}
    volumes:
      - loom-objects:/data

  minio-init:
    labels:
      org.loom.installation: /opt/loom-node
    image: ghcr.io/0800x/loom-node:${LOOM_IMAGE_TAG:?set_LOOM_IMAGE_TAG}
    pull_policy: always
    restart: "no"
    depends_on:
      - minio
    environment:
      LOOM_S3_ENDPOINT: ${LOOM_S3_ENDPOINT:-http://minio:9000}
      LOOM_S3_REGION: ${LOOM_S3_REGION:-us-east-1}
      LOOM_S3_BUCKET: ${LOOM_S3_BUCKET:-loom-attachments}
      LOOM_S3_ACCESS_KEY_ID: ${LOOM_S3_ACCESS_KEY_ID:?set LOOM_S3_ACCESS_KEY_ID}
      LOOM_S3_SECRET_ACCESS_KEY: ${LOOM_S3_SECRET_ACCESS_KEY:?set LOOM_S3_SECRET_ACCESS_KEY}
      LOOM_S3_FORCE_PATH_STYLE: ${LOOM_S3_FORCE_PATH_STYLE:-true}
    entrypoint: ["node", "--experimental-strip-types", "src/attachments/initialize_bucket.ts"]

  loom-node:
    image: ghcr.io/0800x/loom-node:${LOOM_IMAGE_TAG:?set_LOOM_IMAGE_TAG}
    pull_policy: always
    labels:
      org.loom.installation: /opt/loom-node
    restart: unless-stopped
    env_file: .env
    environment:
      # Behind the bundled Caddy (or any reverse proxy on the Docker bridge)
      # every client shares the proxy's container IP. Without trusting that
      # proxy range, all clients collapse into ONE per-IP rate-limit bucket
      # (30 auth/min and 30 websocket upgrades/min for the whole node), which
      # self-locks the node after reconnect bursts. 172.16.0.0/12 covers the
      # default Docker bridge networks and is not Internet-routable.
      LOOM_TRUSTED_PROXY_CIDRS: ${LOOM_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "7483"
    ports:
      - "127.0.0.1:${LOOM_HOST_PORT:-7483}:7483"
    volumes:
      - loom-node-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7483/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    labels:
      org.loom.installation: /opt/loom-node
    profiles: ["caddy"]
    image: ${LOOM_DOCKER_PREFIX:-}caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      loom-node:
        condition: service_healthy
    environment:
      LOOM_PUBLIC_DOMAIN: ${LOOM_PUBLIC_DOMAIN:?set LOOM_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - loom-caddy-data:/data
      - loom-caddy-config:/config

volumes:
  loom-postgres:
    labels:
      org.loom.installation: /opt/loom-node
  loom-objects:
    labels:
      org.loom.installation: /opt/loom-node
  loom-node-data:
    labels:
      org.loom.installation: /opt/loom-node
  loom-caddy-data:
    labels:
      org.loom.installation: /opt/loom-node
  loom-caddy-config:
    labels:
      org.loom.installation: /opt/loom-node


networks:
  default:
    labels:
      org.loom.installation: /opt/loom-node
