name: Flutter and Dart validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DART_VERSION: 3.13.0
  FLUTTER_VERSION: 3.47.0

jobs:
  dart-packages:
    name: Dart package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/loom_models
          - packages/loom_protocol
          - packages/loom_federation
          - packages/loom_storage
          - packages/loom_transport
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Resolve dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Check formatting
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  flutter-analysis-tests:
    name: Flutter validate (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - packages/loom_crypto_bridge
          - packages/loom_design
          - packages/loom_calls
          - apps/loom
          - apps/loom_node_ui
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: ${{ matrix.project }}
        run: flutter pub get
      - name: App Lock immutable-channel regression
        if: matrix.project == 'packages/loom_crypto_bridge'
        working-directory: packages/loom_crypto_bridge
        run: flutter test test/app_lock_session_persistence_test.dart
      - name: Install SQLite for incoming call transport tests
        if: matrix.project == 'apps/loom'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Incoming call transport and production overlay regressions
        if: matrix.project == 'apps/loom'
        working-directory: apps/loom
        run: flutter test test/incoming_call_transport_test.dart test/incoming_call_background_test.dart
      - name: Validate call alert sources
        if: matrix.project == 'apps/loom'
        working-directory: apps/loom
        run: |
          flutter analyze --fatal-infos lib/features/calls/application/call_platform_bridge.dart lib/features/calls/presentation/call_surfaces.dart test/incoming_call_background_test.dart
          dart format lib/features/calls/application/call_platform_bridge.dart lib/features/calls/presentation/call_surfaces.dart test/incoming_call_background_test.dart
          git diff --exit-code -- lib/features/calls/application/call_platform_bridge.dart lib/features/calls/presentation/call_surfaces.dart test/incoming_call_background_test.dart
      - name: Settings UX and localized layout regressions
        if: matrix.project == 'apps/loom'
        working-directory: apps/loom
        run: |
          flutter test test/settings_ux_test.dart
          flutter analyze --fatal-infos lib/features/settings/presentation/settings_detail_screen.dart lib/features/home/presentation/messenger_shell.dart lib/features/calls/presentation/calls_screen.dart lib/features/security/presentation/app_lock_gate.dart lib/features/settings/presentation/nearby_mode_screen.dart lib/features/settings/presentation/nearby_diagnostics_screen.dart lib/features/chat_folders/presentation/chat_folders_settings_screen.dart test/settings_ux_test.dart ../../packages/loom_design/lib/src/components/loom_settings.dart
          dart format lib/features/settings/presentation/settings_detail_screen.dart lib/features/home/presentation/messenger_shell.dart lib/features/home/presentation/sync_title.dart lib/features/calls/presentation/calls_screen.dart lib/features/security/presentation/app_lock_gate.dart lib/features/settings/presentation/nearby_mode_screen.dart lib/features/settings/presentation/nearby_diagnostics_screen.dart lib/features/chat_folders/presentation/chat_folders_settings_screen.dart test/settings_ux_test.dart ../../packages/loom_design/lib/src/components/loom_settings.dart
          git diff -- lib/features/settings/presentation/settings_detail_screen.dart lib/features/home/presentation/messenger_shell.dart lib/features/home/presentation/sync_title.dart lib/features/calls/presentation/calls_screen.dart lib/features/security/presentation/app_lock_gate.dart lib/features/settings/presentation/nearby_mode_screen.dart lib/features/settings/presentation/nearby_diagnostics_screen.dart lib/features/chat_folders/presentation/chat_folders_settings_screen.dart test/settings_ux_test.dart ../../packages/loom_design/lib/src/components/loom_settings.dart
      - name: Chat reply, media security and gestures
        if: matrix.project == 'apps/loom'
        working-directory: apps/loom
        run: |
          flutter test test/chat_content_security_test.dart test/chat_reply_gesture_test.dart test/swipe_navigation_test.dart test/messenger_header_test.dart test/media_preparation_test.dart test/profile_gesture_test.dart test/media_player_content_test.dart
          flutter analyze --fatal-infos lib/features/home/presentation/messenger_shell.dart lib/features/messaging/application/message_content.dart lib/features/messaging/application/encrypted_media.dart lib/features/messaging/application/messaging_session_controller.dart test/chat_content_security_test.dart test/chat_reply_gesture_test.dart test/swipe_navigation_test.dart test/messenger_header_test.dart test/media_preparation_test.dart test/profile_gesture_test.dart test/media_player_content_test.dart lib/features/home/presentation/swipe_navigation.dart lib/app/appearance_preferences.dart lib/features/profile/presentation/profile_header.dart lib/features/profile/presentation/profile_screen.dart lib/features/profile/presentation/peer_profile_screen.dart lib/features/messaging/application/media_preparation.dart lib/features/media/application/playback_controller.dart lib/features/media/presentation/playback_host.dart lib/features/media/presentation/camera_screen.dart
      - name: Check formatting
        working-directory: ${{ matrix.project }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ matrix.project }}
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: ${{ matrix.project }}
        run: flutter test

  mls-native-integration:
    name: Native MLS and production group controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build and test native MLS
        run: |
          cargo test --locked --manifest-path native/loom_mls/Cargo.toml
          cargo build --locked --manifest-path native/loom_mls/Cargo.toml
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install signed API fixture dependencies
        working-directory: services/loom_server
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Test real signed transport and group controller
        env:
          LOOM_TEST_MLS_LIBRARY: ${{ github.workspace }}/native/loom_mls/target/debug/libloom_mls.so
        run: |
          cd packages/loom_transport
          dart pub get
          dart test test/group_session_integration_test.dart
          cd ../../apps/loom
          flutter pub get
          flutter test test/groups_controller_native_test.dart test/message_notifications_test.dart

