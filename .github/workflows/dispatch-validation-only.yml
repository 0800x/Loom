name: Dispatch Loom validation only
# One-shot helper: dispatch validation without rebuilding release packages.
# Re-run after updating the conversation deletion UX test.
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: contains(github.event.head_commit.message || '', '[kick-validate-only]')
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch validate-only on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run loom-alpha.yml --repo 0800x/Loom --ref main -f build_target=validate-only
