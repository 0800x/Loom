name: Repair Loom 0.3 CI

on:
  push:
    branches:
      - fix/v0.3-ci-home-node-installer

permissions:
  contents: write

concurrency:
  group: loom-v03-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply Dart lint fixes and format all client packages
        shell: bash
        run: |
          set -euo pipefail

          (cd apps/loom && flutter pub get && dart fix --apply)
          (cd packages/loom_crypto_bridge && flutter pub get && dart fix --apply)

          dart format apps/loom apps/loom_node_ui packages
          dart format --output=none --set-exit-if-changed apps/loom apps/loom_node_ui packages

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test the Home Node server fixture dependencies
        working-directory: services/loom_server
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test

      - name: Resolve the patched OpenMLS provider and build native libraries for Flutter tests
        run: |
          cargo update --manifest-path native/loom_mls/Cargo.toml

          # The affected release lines must not appear anywhere in the resolved
          # lockfile. Do not suppress cargo-audit findings or allow a partial fix.
          python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("native/loom_mls/Cargo.lock").read_text())
          packages = lock["package"]
          versions = {}
          for package in packages:
              versions.setdefault(package["name"], []).append(package["version"])

          def at_least(version, minimum):
              return tuple(map(int, version.split("."))) >= tuple(map(int, minimum.split(".")))

          for name, minimum in (("crypto-bigint", "0.7.6"), ("ctutils", "0.4.4")):
              found = versions.get(name, [])
              assert found, f"{name} is absent from Cargo.lock"
              vulnerable = [version for version in found if not at_least(version, minimum)]
              assert not vulnerable, f"{name} still has vulnerable versions: {vulnerable}"
              print(f"{name}: {', '.join(found)}")
          PY

          if cargo tree --locked --manifest-path native/loom_mls/Cargo.toml -i crypto-bigint@0.5.5; then
            echo "::error::Vulnerable crypto-bigint 0.5.5 is still in the resolved graph."
            exit 1
          fi
          if cargo tree --locked --manifest-path native/loom_mls/Cargo.toml -i ctutils@0.4.3; then
            echo "::error::Vulnerable ctutils 0.4.3 is still in the resolved graph."
            exit 1
          fi
          cargo tree --locked --manifest-path native/loom_mls/Cargo.toml -i crypto-bigint
          cargo tree --locked --manifest-path native/loom_mls/Cargo.toml -i ctutils
          cargo build --locked --manifest-path native/loom_mls/Cargo.toml
          cargo build --locked --manifest-path native/loom_vodozemac_poc/Cargo.toml

      - name: Analyze and test the application
        working-directory: apps/loom
        env:
          LOOM_TEST_MLS_LIBRARY: ${{ github.workspace }}/native/loom_mls/target/debug/libloom_mls.so
          LOOM_VODOZEMAC_POC_LIB: ${{ github.workspace }}/native/loom_vodozemac_poc/target/debug/libloom_vodozemac_poc.so
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Analyze and test the crypto bridge
        working-directory: packages/loom_crypto_bridge
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Verify design and storage packages
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/loom_design && flutter pub get && flutter analyze --fatal-infos && flutter test)
          (cd packages/loom_storage && dart pub get && dart analyze --fatal-infos && dart test)

      - name: Run native MLS and Vodozemac regression tests
        run: |
          cargo test --locked --manifest-path native/loom_mls/Cargo.toml
          cargo test --locked --manifest-path native/loom_vodozemac_poc/Cargo.toml
          cargo build --locked --manifest-path native/loom_vodozemac_poc/Cargo.toml

      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cd native/loom_mls
          cargo audit

      - name: Commit only verified formatter and lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/loom apps/loom_node_ui packages native/loom_mls/Cargo.lock
          if git diff --cached --quiet; then
            echo "No formatter or lockfile changes were required."
            exit 0
          fi
          git commit -m "fix(ci): format Loom 0.3 and refresh audited Rust lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
