name: Temporary Loom restore-branch formatter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'restore/v0.3.0-alpha.1-final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Format restored and edited Dart sources
        run: |
          dart format \
            apps/loom/lib/app/loom_app.dart \
            apps/loom/lib/features/accounts/application/account_registry.dart \
            apps/loom/lib/features/accounts/application/account_workspace.dart \
            apps/loom/lib/features/accounts/presentation/accounts_screen.dart \
            apps/loom/lib/features/home/presentation/global_search_screen.dart \
            apps/loom/lib/features/messaging/application/message_fold.dart \
            apps/loom/lib/features/messaging/application/messaging_session_controller.dart \
            apps/loom/lib/features/messaging/application/search_preferences.dart \
            apps/loom/lib/features/onboarding/presentation/backup_password_dialog.dart \
            apps/loom/lib/features/onboarding/presentation/onboarding_chrome.dart \
            apps/loom/lib/features/security/application/db_encryption.dart \
            apps/loom/lib/features/security/application/experimental_ratchet.dart \
            apps/loom/lib/features/security/application/sqlcipher_loader.dart \
            apps/loom/lib/features/security/presentation/security_screen.dart \
            apps/loom/lib/main.dart \
            apps/loom/test/message_fold_test.dart \
            packages/loom_crypto_bridge/lib/src/account_scope.dart \
            packages/loom_crypto_bridge/lib/src/app_lock.dart \
            packages/loom_crypto_bridge/test/account_scope_test.dart \
            packages/loom_design/lib/src/components/loom_anchored_menu.dart \
            packages/loom_design/lib/src/components/loom_components.dart \
            packages/loom_design/lib/src/components/loom_messaging.dart \
            packages/loom_design/lib/src/loom_glass.dart \
            packages/loom_design/lib/src/loom_surface_motion.dart \
            packages/loom_design/lib/src/loom_theme.dart \
            packages/loom_storage/lib/src/local_messaging_cleanup.dart \
            packages/loom_storage/lib/src/messaging_store.dart \
            packages/loom_storage/lib/src/secure_sqlite.dart \
            packages/loom_storage/test/secure_sqlite_test.dart
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/loom packages/loom_crypto_bridge packages/loom_design packages/loom_storage
          git commit -m "style: format restored Loom 0.3 sources"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
